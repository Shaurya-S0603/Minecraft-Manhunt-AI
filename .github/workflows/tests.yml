name: Source checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify the Hunter source
        run: |
          python -m compileall -q quickstart ai-controller/src
          python -m unittest discover -s quickstart/tests -v
